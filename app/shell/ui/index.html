<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sync-Strata</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="boot">
  <section class="boot-card">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span>
      <span>Sync-Strata</span>
    </div>
    <span id="pill" class="pill"><span class="dot"></span><span id="pill-text">起動中</span></span>
    <ul id="steps" class="steps"></ul>
    <div id="error" class="error hidden"></div>
    <div id="actions" class="row hidden">
      <button id="retry" class="btn primary">もう一度</button>
    </div>
  </section>
</main>
<script src="boot.js"></script>
</body>
</html>
